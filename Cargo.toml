[package]
name = "github_viewer"
version = "0.0.1"
edition = "2024"

[dependencies]
ctru-rs = { git = "https://github.com/rust3ds/ctru-rs" }
citro3d = { git = "https://github.com/rust3ds/citro3d-rs.git" }
image = { version = "0.25.10", features = ["jpeg"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
