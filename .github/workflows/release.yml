name: Build and Release 3DS Homebrew

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Compile Rust ELF Binary
        run: |
          cargo build --release --target armv6k-nintendo-3ds -Z build-std=core,alloc,std

      - name: Build 3DSX and CIA Bundles
        run: |
          # 1. Create a metadata SMDH manually via bannertool
          bannertool makesmdh \
            -s "GitHub Viewer" \
            -l "Inspect GitHub repos natively" \
            -a "TokynBlast" \
            -o target/github_viewer.smdh

          # 2. Convert ELF into the 3DSX Homebrew Launcher target
          3dsxtool target/armv6k-nintendo-3ds/release/ds.elf github_viewer.3dsx --smdh=target/github_viewer.smdh

          # 3. Compile the installable CIA file
          makerom -f cia \
            -o github_viewer.cia \
            -elf target/armv6k-nintendo-3ds/release/ds.elf \
            -rsf target/armv6k-nintendo-3ds/release/ds.elf \
            -smdh target/github_viewer.smdh \
            -major 1 -minor 0 -micro 0 \
            -titleid 000400000FFFFF00

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            github_viewer.3dsx
            github_viewer.cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
