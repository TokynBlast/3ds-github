name: Build and Release 3DS Homebrew

on:
  push:
    tags:
      - 'v*'
      - 'unstable_v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          apt-get update
          apt-get install -y wget unzip
          wget https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.3/makerom-v0.18.3-ubuntu_x86_64.zip
          unzip *.zip && mv makerom /usr/local/bin/makerom && chmod +x /usr/local/bin/makerom

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=unstable_build" >> $GITHUB_OUTPUT
          fi

      - name: Setup devkitARM
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH
          echo "/opt/devkitpro/tools/bin" >> $GITHUB_PATH

      - name: Build
        run: make

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: |
            build/3ds_github.3dsx
            build/3ds_github.cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout UniStore Repo
        uses: actions/checkout@v4
        with:
          repository: 'TokynBlast/unistore'
          token: ${{ secrets.CROSS_PUSH }}
          path: 'unistore-repo'

      - name: Update UniStore
        shell: python
        run: |
          import json
          tag_version = "${{ steps.get_version.outputs.VERSION }}"
          is_unstable = "unstable" in tag_version
          unistore_path = "unistore-repo/meimei-prog-tools.unistore"

          with open(unistore_path, "r") as f:
              data = json.load(f)

          if "revision" in data["storeInfo"]:
              data["storeInfo"]["revision"] += 1

          for app in data["storeContent"]:
              if app["info"]["title"] == "3DS GitHub":
                  app["info"]["version"] = tag_version
                  prefix = "unstable" if is_unstable else "stable"
                  base_url = f"https://github.com/TokynBlast/3ds-github/releases/download/{tag_version}"
                  for ext in ["cia", "3dsx"]:
                      key = f"{prefix}_{ext}"
                      if key in app and len(app[key]) > 0:
                          app[key][0]["file"] = f"{base_url}/3ds_github.{ext}"

          with open(unistore_path, "w") as f:
              json.dump(data, f, indent=2)

      - name: Push UniStore
        run: |
          cd unistore-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meimei-prog-tools.unistore
          git diff-index --quiet HEAD || (git commit -m "chore: update unistore to ${{ steps.get_version.outputs.VERSION }}" && git push origin main)
