name: Build and Release 3DS Homebrew

on:
  push:
    tags:
      - 'v*'
      - 'unstable_v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (Clang, Headers, 3DS Tools)
        run: |
          apt-get update
          apt-get install -y clang libclang-dev llvm wget unzip

          wget https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip
          unzip makerom-v0.19.0-ubuntu_x86_64.zip
          mv makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom

          rm -rf makerom-v0.19.0-ubuntu_x86_64.zip

      - name: Extract Tag or Manual Version Name
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
          else
            TAG_NAME="unstable_manual_build"
          fi
          echo "VERSION=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Setup devkitARM Environment Paths
        run: |
          echo "DEVKITPRO=/opt/devkitpro" >> $GITHUB_ENV
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> $GITHUB_ENV
          echo "/opt/devkitpro/devkitARM/bin" >> $GITHUB_PATH

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Compile Rust ELF Binary
        run: |
          cargo build --release --target armv6k-nintendo-3ds -Z build-std=core,alloc,std,panic_abort

      - name: Build 3DSX and CIA Bundles
        run: |
          mkdir -p target

          # Explicitly add the devkitpro tool folder to the executing shell path
          export PATH="/opt/devkitpro/tools/bin:$PATH"

          # 1. Generate the SMDH metadata
          smdhtool --create "3DS GitHub" "Inspect GitHub repos natively" "MeiMei" icon.png target/github_viewer.smdh

          # 2. Locate the compiled ELF dynamically
          ELF_PATH=$(find target/armv6k-nintendo-3ds/release/ -name "*.elf" | head -n 1)
          echo "Found compiled ELF at: $ELF_PATH"

          # 3. Convert ELF into the 3DSX executable
          3dsxtool "$ELF_PATH" github_viewer.3dsx --smdh=target/github_viewer.smdh

          # 4. Compile the installable CIA file
          makerom -f cia -o github_viewer.cia -elf "$ELF_PATH" -smdh target/github_viewer.smdh -major 1 -minor 0 -micro 0 -titleid 000400000FFFFF00

      - name: Create GitHub Release and Upload Binaries
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          files: |
            github_viewer.3dsx
            github_viewer.cia
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout UniStore Repository
        uses: actions/checkout@v4
        with:
          repository: 'TokynBlast/unistore'
          token: ${{ secrets.CROSS_PUSH }}
          path: 'unistore-repo'

      - name: Dynamically Update UniStore JSON
        shell: python
        run: |
          import json
          import os

          tag_version = "${{ steps.get_version.outputs.VERSION }}"
          is_unstable = tag_version.startswith("unstable_")
          unistore_path = "unistore-repo/meimei-prog-tools.unistore"

          with open(unistore_path, "r") as f:
              data = json.load(f)

          if "revision" in data["storeInfo"]:
              data["storeInfo"]["revision"] += 1

          for app in data["storeContent"]:
              if app["info"]["title"] == "GitHub Viewer":
                  app["info"]["version"] = tag_version

                  if is_unstable:
                      app["script_unstable_cia"][0]["file"] = f"https://github.com/TokynBlast/3ds-github/releases/download/{tag_version}/github_viewer.cia"
                      app["script_unstable_3dsx"][0]["file"] = f"https://github.com/TokynBlast/3ds-github/releases/download/{tag_version}/github_viewer.3dsx"
                  else:
                      app["script"][0]["file"] = f"https://github.com/TokynBlast/3ds-github/releases/download/{tag_version}/github_viewer.cia"
                      app["script_3dsx"][0]["file"] = f"https://github.com/TokynBlast/3ds-github/releases/download/{tag_version}/github_viewer.3dsx"

          with open(unistore_path, "w") as f:
              json.dump(data, f, indent=2)

      - name: Push Updated UniStore to External Repo
        run: |
          cd unistore-repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add meimei-prog-tools.unistore
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update unistore to ${{ steps.get_version.outputs.VERSION }}" && git push origin main)
